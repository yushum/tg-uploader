<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <title>直播回看</title>
  <script>
    try {
      const savedTheme = localStorage.getItem('theme-mode');
      document.documentElement.dataset.theme = savedTheme === 'light'
        ? 'light'
        : (savedTheme === 'dark' || savedTheme === 'oled' || matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="/static/app.css?v=20260901-clean-routes">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" data-spa-link aria-label="返回主播列表">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z"/></svg>
        </span>
        <span class="brand-name">直播回看</span>
      </a>

      <form id="siteSearch" class="site-search" role="search">
        <input id="siteSearchInput" type="search" placeholder="搜索主播" autocomplete="off" aria-label="搜索主播">
        <button type="submit" aria-label="搜索">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        </button>
      </form>

      <div class="theme-picker">
        <button id="themeButton" class="theme-button" type="button" aria-haspopup="menu" aria-expanded="false">
          <svg id="themeIcon" aria-hidden="true" viewBox="0 0 24 24"></svg>
          <span id="themeLabel">跟随设备</span>
          <svg class="chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></svg>
        </button>
        <div id="themeMenu" class="theme-menu" role="menu" hidden>
          <button type="button" role="menuitemradio" data-theme-choice="auto">
            <span>跟随设备</span><span class="theme-check">✓</span>
          </button>
          <button type="button" role="menuitemradio" data-theme-choice="light">
            <span>浅色</span><span class="theme-check">✓</span>
          </button>
          <button type="button" role="menuitemradio" data-theme-choice="dark">
            <span>深色</span><span class="theme-check">✓</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <aside class="side-nav" aria-label="主导航">
    <span class="side-nav-label">浏览</span>
    <a href="/" class="side-nav-item" data-spa-link data-nav-home>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8v9h-6v-6H9v6H3v-9Z"/></svg>
      <span>首页</span>
    </a>
    <span class="side-nav-divider" aria-hidden="true"></span>
    <span class="side-nav-label">主播排序</span>
    <button type="button" class="side-nav-item" data-nav-sort="recent">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>最近更新</span>
    </button>
    <button type="button" class="side-nav-item" data-nav-sort="name">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h10M5 17h7"/></svg>
      <span>名称索引</span>
    </button>
  </aside>

  <main id="app" class="app-shell" aria-live="polite">
    <div class="loading-state">
      <span class="spinner"></span>
      <p>正在加载录播…</p>
    </div>
  </main>

  <template id="errorTemplate">
    <section class="empty-state">
      <div class="empty-icon">!</div>
      <h1>暂时无法加载</h1>
      <p></p>
      <button class="primary-button" type="button">重试</button>
    </section>
  </template>

  <script src="/static/app.js?v=20260901-clean-routes" defer></script>
</body>
</html>
