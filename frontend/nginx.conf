server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 1.1.1.1 8.8.8.8 ipv6=off valid=60s;
    set $api_upstream live.yushum.com;

    location /static/ {
        alias /usr/share/nginx/player-assets/;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass https://$api_upstream;
        proxy_ssl_server_name on;
        proxy_ssl_name $api_upstream;
        proxy_set_header Host $api_upstream;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /sw.js {
        # SW 自身绝不能被缓存，否则发版后客户端收不到更新。
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        # 老版本 nginx 的 mime.types 可能没有 webmanifest 映射，这里显式指定。
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=3600";
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
