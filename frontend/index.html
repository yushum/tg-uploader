<!doctype html>
<html lang="zh-CN" data-player-library-only>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f5f7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Replay">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>Replay · 直播回放</title>
  <script>
    (() => {
      const mode = localStorage.getItem('replay-theme') || localStorage.getItem('replay-demo-theme') || 'auto';
      const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme:dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.themeMode = mode;
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css?v=20260901-rotate-player">
  <link rel="stylesheet" href="/style.css?v=8">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" data-link aria-label="返回首页">
        <span class="brand-glyph"><svg viewBox="0 0 24 24"><path d="m9.2 7.4 7.2 4.6-7.2 4.6V7.4Z"/></svg></span><span>Replay</span>
      </a>
      <nav class="primary-nav" aria-label="主导航"><a href="/" data-link data-nav="home">首页</a><a href="/streamers" data-link data-nav="streamers">主播</a><a href="/favorites" data-link data-nav="favorites">收藏</a></nav>
      <nav class="crumbs" aria-label="当前位置"></nav>
      <form class="global-search" role="search">
        <svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input type="search" placeholder="搜索所有主播" autocomplete="off" aria-label="搜索所有主播">
      </form>
      <div class="theme-picker">
        <button class="theme-button" type="button" aria-haspopup="menu" aria-expanded="false"><span class="theme-symbol"></span><span class="theme-label">自动</span></button>
        <div class="theme-menu" role="menu" hidden>
          <button type="button" data-theme-choice="auto"><span>◐</span><span>自动</span><i>跟随系统</i><b>✓</b></button>
          <button type="button" data-theme-choice="light"><span>☀</span><span>浅色</span><b>✓</b></button>
          <button type="button" data-theme-choice="dark"><span>●</span><span>深色</span><b>✓</b></button>
        </div>
      </div>
    </div>
  </header>

  <main id="app"><div class="initial-loading"><i></i><span>正在加载录像…</span></div></main>

  <div class="toast" role="status" aria-live="polite"></div>
  <button type="button" id="liveFab" class="live-fab" aria-label="打开推流面板"><span aria-hidden="true">📡</span><em>推流</em><b id="liveFabBadge" hidden></b><i id="liveFabDot" hidden></i></button>
  <div class="live-sheet-backdrop" id="liveSheetBackdrop" hidden></div>
  <section class="live-sheet" id="liveSheet" hidden aria-label="推流到 Telegram 频道">
    <header class="live-sheet-head"><strong>📡 推流到 Telegram 频道</strong><button type="button" id="liveSheetClose" aria-label="关闭">✕</button></header>
    <p class="live-status-line" id="liveStatus">空闲</p>
    <label class="live-field"><span>目标频道</span><input id="liveChannel" placeholder="@my_channel" autocomplete="off"></label>
    <div class="live-field"><span>主播（可多选，不选=全部）<span class="live-field-ops"><button type="button" id="liveStreamersAll">全选</button><button type="button" id="liveStreamersNone">清空</button></span></span>
      <div class="live-streamer-box" id="liveStreamerBox"><p class="live-hint">加载中…</p></div>
    </div>
    <div class="live-field"><span>日期范围（不填=不限）＋排除日期</span>
      <div class="live-row">
        <input type="date" id="liveFrom" aria-label="开始日期">
        <span class="live-tilde">~</span>
        <input type="date" id="liveTo" aria-label="结束日期">
        <button type="button" id="liveSearch">查找</button>
      </div>
      <input class="live-exclude" id="liveExclude" placeholder="排除日期，如 2026-08-01, 2026-08-02" autocomplete="off">
    </div>
    <div class="live-field"><span>查找结果<span class="live-field-ops"><button type="button" id="liveResultsAll">全选</button><button type="button" id="liveResultsInvert">反选</button><button type="button" id="liveResultsNone">清空</button></span></span></div>
    <div class="live-results" id="liveResults"><p class="live-hint">勾好主播和日期，点「查找」列出录像。打勾即加入待播；把某天的勾去掉就是排除那天。</p></div>
    <div class="live-field"><span>待播清单（<b id="liveCount">0</b>）<span class="live-field-ops"><button type="button" id="liveClear">清空</button></span></span>
      <ol class="live-playlist" id="livePlaylist"><li class="live-hint">还没有选片。可以在播放页给场次打勾，或上面按范围查找后勾选。</li></ol>
    </div>
    <div class="live-actions"><button type="button" id="liveStartBtn" class="primary">开始推流</button><button type="button" id="liveStopBtn">停止</button></div>
  </section>
  <script src="/static/app.js?v=20260901-rotate-player"></script>
  <script type="module" src="/app.js?v=8"></script>
  <script>
    // PWA：注册 Service Worker（仅缓存 App 壳子，录像流直通网络）。
    // 非 https/localhost 环境会自动失败，静默忽略即可。
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
